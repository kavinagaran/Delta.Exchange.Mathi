# BTC Trend Engine — default configuration.
# Every value can be overridden with an ENGINE_* environment variable using
# double-underscore path separators, e.g. ENGINE_DATA_QUALITY__STALE_FLOOR_SECONDS=10.
# TOML instead of YAML is deliberate: tomllib is stdlib, so configuration
# parsing adds zero dependencies (Trend_Engine.md §20 allows env-var config).

[engine]
symbol = "BTCUSD"
base_currency = "BTC"
quote_currency = "USD"
# The engine is loopback-only and never proxied (ADR 0001).
host = "127.0.0.1"
port = 5055

[market_data]
websocket_url = "wss://socket.india.delta.exchange"
rest_url = "https://api.india.delta.exchange"
# Channels subscribed for engine.symbol. MOVE contracts stay REST-quote-only
# (assumption A3: 10-level single-maker books are not worth reconstructing).
channels = ["l2_updates", "all_trades", "v2/ticker", "mark_price", "funding_rate"]
# The committed decision remains a closed 5m candle.  The 30m layer replaces
# the slow 4h structural layer so the score can recognise a short-term shift
# earlier, while the 1h layer still anchors the broader intraday context.
candle_resolutions = ["5m", "15m", "30m", "1h"]
candle_bootstrap_limit = 320

[market_data.reconnect]
initial_backoff_seconds = 1.0
max_backoff_seconds = 60.0
jitter_fraction = 0.25

[market_data.rate_limit]
# Delta India exposes no rate-limit headers (assumption A4); the budget is
# enforced client-side. Four processes share one key, so the engine's REST
# share is deliberately small — the WS carries the continuous load.
requests_per_second = 2.0
burst = 5

[market_data.private]
# Phase 4 (security-checklist.md): a read-only key for position/order
# reconciliation, never the trading key. Disabled until the auth-frame shape
# (market_data/delta_private_ws.py) is confirmed and a real read-only key
# exists. Names ENV VARS only -- never a secret value in this file.
enabled = false
channels = ["positions", "orders"]
api_key_env = "ENGINE_READ_ONLY_API_KEY"
api_secret_env = "ENGINE_READ_ONLY_API_SECRET"

[orderbook]
# Validate both sequence continuity and Delta's documented top-10 CRC32
# checksum (asks ascending, bids descending). A mismatch invalidates the book
# and forces a fresh snapshot before another score can be committed.
validate_checksums = true
# A book this deep (~2,050 levels/side) only needs the top for features.
feature_depth_levels = 50

[data_quality]
# warning = stale_multiplier x rolling median inter-message interval;
# hard threshold = max(warning, stale_floor_seconds).  (§6.5)
stale_multiplier = 3.0
stale_floor_seconds = 5.0
median_window = 64
# Delta accepts authenticated timestamps within a five-second window. Its
# public WebSocket event clock currently leads the REST/server clock by about
# 3.6 seconds across all BTCUSD feeds, so a 500 ms absolute comparison falsely
# labels a synchronized host as CLOCK_DRIFT. Keep the bound aligned to the
# venue's own safety window; larger offsets still fail closed.
max_clock_drift_ms = 5000.0
fail_closed = true

[storage]
data_dir = "data"
# Raw events: plain NDJSON for the active hour (crash-safe appends), gzipped
# on rotation. Retention enforced by scripts/prune_data.py.
raw_retention_days = 14
snapshot_retention_days = 180
market_snapshot_retention_days = 30
min_free_gb = 2.0
fsync_interval_seconds = 5.0
