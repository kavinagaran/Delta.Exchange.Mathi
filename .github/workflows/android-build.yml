# Builds the Android app (mv_btc_bot) release APK on GitHub's runners.
#
# Why this exists: nothing in this project's usual workflow has needed a
# local Flutter/Android SDK install, so there was no way to turn Dart source
# changes into an installable build without one. This produces a debug-signed
# release APK (matching android/app/build.gradle.kts's existing signing
# config -- there is no release keystore in this repo) as a downloadable
# workflow artifact, triggered either automatically on app changes or by
# hand.

name: Android build

on:
  push:
    branches: ["**"]
    paths:
      - "mv_btc_bot/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mv_btc_bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches android/app/build.gradle.kts's sourceCompatibility /
          # targetCompatibility / jvmTarget (JavaVersion.VERSION_17).
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # Advisory only, same as the Python suite's ruff/mypy step in
        # ci.yml: there is no baseline yet to know this starts clean, and a
        # backlog of pre-existing warnings would make this permanently red
        # for reasons unrelated to whatever changed.
        continue-on-error: true
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mv_btc_bot-release-apk
          path: mv_btc_bot/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
